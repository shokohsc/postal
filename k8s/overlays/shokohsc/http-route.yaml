---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postal
  annotations:
    dashboard.home.arpa/name: dev-postal
    dashboard.home.arpa/url: https://dev.postal.home.arpa
    dashboard.home.arpa/icon: wrench
spec:
  hostnames:
  - dev.postal.home.arpa
  parentRefs:
  - name: postal
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: postal
  rules:
  - backendRefs:
    - name: postal
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
