---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postal
spec:
  hostnames:
  - postal.cluster.local
  parentRefs:
  - name: postal
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: postal
  rules:
  - backendRefs:
    - name: postal
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
