apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: postal
build:
  artifacts:
    - image: shokohsc/postal
      context: .
      sync:
        infer:
          - src/**/*.js
          - src/**/*.vue
      docker:
        dockerfile: Dockerfile.dev
manifests:
  kustomize:
    paths:
      - k8s/base
deploy:
  kubectl: {}
profiles:
  - name: dev
    activation:
      - command: dev
    build:
      artifacts:
        - image: shokohsc/postal
          sync:
            infer:
              - src/**/*.js
              - src/**/*.vue
  - name: shokohsc
    build:
      artifacts:
        - image: shokohsc/postal
          sync:
            infer:
              - src/**/*.js
              - src/**/*.vue
          kaniko:
            cache:
              repo: shokohsc/postal
            dockerfile: Dockerfile.dev
            useNewRun: true
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
          policy.gatekeeper.sh/ignore-psp-seccomp-baseline: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
    manifests:
      kustomize:
        paths:
          - k8s/overlays/shokohsc
    deploy:
      kubectl: {}
  - name: prod
    build:
      artifacts:
        - image: shokohsc/postal
          kaniko:
            cache:
              repo: shokohsc/postal
            dockerfile: Dockerfile
            useNewRun: true
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
          policy.gatekeeper.sh/ignore-psp-seccomp-baseline: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
